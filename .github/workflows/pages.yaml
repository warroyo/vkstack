# The hosted sample at vkstack.warroyo.com.
#
# A static build is a snapshot, so publishing is the only thing that makes it current:
# there is no server behind it to refresh itself. Two things can date it — the UI and the
# upstream data — so both trigger a rebuild. Either way the site runs a released version,
# never an untagged commit from main: what the page shows has to match a CLI people can
# install.
name: pages

on:
  # A version was tagged. The tag push is the trigger, not the release: goreleaser
  # publishes the release with GITHUB_TOKEN, and GitHub starts no workflows from events
  # that token causes, so `release: published` never fired.
  push:
    tags: ["v*"]
  schedule:
    # 07:00 UTC, small hours in Mountain time. This is the one that catches upstream
    # moving; off-peak so a slow fetch does not collide with anyone using the site. It
    # rebuilds the newest tag, not main, so fresh data never ships unreleased code.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A manual run during a scheduled one would race for the same deployment. Newest wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history brings the tags, which the next step picks from.
          fetch-depth: 0

      # A tag push builds that tag. The nightly and manual runs build the newest release.
      - name: pick release
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(git tag -l 'v*' --sort=-v:refname | head -1)"
            git checkout --quiet "${tag}"
          fi
          echo "TAG=${tag}" >> "${GITHUB_ENV}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The page reports this, so a published site can be traced back to what built it.
      - name: build
        run: go build -ldflags "-s -w -X main.version=${TAG}" -o vkstack ./cmd/vkstack

      # The runner's cache starts empty every time, so this is a full fetch, and it is
      # the step that decides how fresh the published site is.
      - name: refresh
        run: ./vkstack refresh

      - name: generate
        run: ./vkstack static --out dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this a production deploy, which is what the custom
          # domain points at. Without it Pages treats the upload as a preview.
          command: pages deploy dist --project-name=vkstack --branch=main
