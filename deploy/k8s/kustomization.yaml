# Minimal hosted instance: one Deployment, one ClusterIP Service.
#
#   kubectl apply -k deploy/k8s
#
# Pin the tag rather than tracking latest:
#
#   kustomize edit set image ghcr.io/warroyo/vkstack:v0.1.0
#
# Use this as a base for anything you need on top (Ingress, namespace, replicas):
#
#   resources: [github.com/warroyo/vkstack/deploy/k8s?ref=v0.1.0]
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: vkstack

images:
  - name: ghcr.io/warroyo/vkstack
    newTag: latest
